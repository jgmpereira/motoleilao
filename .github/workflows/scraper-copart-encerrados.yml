name: Scraper — Copart Encerrados

on:
  schedule:
    - cron: '0 1 * * *'    # 22h BRT (01h UTC) todo dia
  workflow_dispatch:

jobs:
  raspar:
    runs-on: ubuntu-latest
    name: Atualizar arrematados Copart
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scrapers/package-lock.json

      - name: Instalar dependências
        working-directory: scrapers
        run: npm install

      - name: Instalar Chromium (Playwright)
        working-directory: scrapers
        run: npx playwright install chromium --with-deps

      - name: Executar scraper
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node copart-encerrados.js
